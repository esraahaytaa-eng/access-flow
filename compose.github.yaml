# Optional GitHub sandbox adapter (DECISIONS.md A1 note 2026-11-01; README "GitHub sandbox").
# Use only with a separate project and the git-ignored .env.github, never with the default one:
#   docker compose -p accessflow-github --env-file .env.github -f compose.yaml -f compose.github.yaml up --build
# This file holds no secret: every value comes from .env.github.
services:
  app:
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env.github}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?set GITHUB_REPOSITORY in .env.github}
      GITHUB_TOOL_ID: ${GITHUB_TOOL_ID:?set GITHUB_TOOL_ID in .env.github}
