# Runs the same Docker commands as local development (plan milestone C1). The image build,
# the Go checks and the browser smoke test are independent, so they run as parallel jobs (M16).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    name: Build images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images (Go build, frontend type check, tests and build)
        run: docker compose build

  checks:
    name: Go checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go module and build caches live in the workspace (.cache is git- and docker-ignored)
      # so they survive between runs; -count=1 keeps every test running every time.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ hashFiles('go.sum') }}-

      - name: Test (gofmt, go vet, go test -race against PostgreSQL)
        run: docker compose --profile test run --rm -e GOMODCACHE=/src/.cache/mod -e GOCACHE=/src/.cache/go-build tests

  e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Browser smoke test (Playwright, fresh isolated Compose project)
        run: ./e2e.sh
