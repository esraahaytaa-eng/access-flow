# Runs the same Docker commands as local development (plan milestone C1).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build images (Go build, frontend type check and build)
        run: docker compose build

      - name: Test (gofmt, go vet, go test -race against PostgreSQL)
        run: docker compose --profile test run --rm tests
