# Fixed local credentials for this case-study application (DECISIONS.md A2, 2026-10-28).
# PostgreSQL is never published to the host; only app is, on port 8080 (host port: ACCESSFLOW_PORT).
x-db-credentials: &db-credentials
  POSTGRES_PASSWORD: postgres_local
  ACCESSFLOW_OWNER_PASSWORD: accessflow_owner_local
  ACCESSFLOW_APP_PASSWORD: accessflow_app_local
  MOCKTOOLS_DB_PASSWORD: mocktools_local

x-postgres: &postgres
  image: postgres:18.6-alpine3.24
  environment: *db-credentials
  healthcheck:
    # TCP check: the temporary server used while init.sh runs listens only on the socket.
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  postgres:
    <<: *postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    restart: unless-stopped

  mocktools:
    build:
      context: .
      target: mocktools
    environment:
      DATABASE_URL: postgres://mocktools:mocktools_local@postgres:5432/mocktools
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/mocktools", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    ports:
      - "${ACCESSFLOW_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://accessflow_app:accessflow_app_local@postgres:5432/accessflow
      MIGRATION_DATABASE_URL: postgres://accessflow_owner:accessflow_owner_local@postgres:5432/accessflow
      # Local demo (DECISIONS.md A4/D12 notes, 2026-10-29): documented accounts with these
      # passwords and the demo seed. The server refuses demo mode outside this setup; a real
      # deployment removes these three lines.
      ACCESSFLOW_DEMO: "true"
      ACCESSFLOW_ENV: local
      DEMO_PASSWORDS: &demo-passwords admin=Demo-Admin-2026,infosec=Demo-InfoSec-2026,hr=Demo-HR-2026,auditor=Demo-Auditor-2026,manager=Demo-Manager-2026,owner=Demo-Owner-2026,cloud=Demo-Cloud-2026,employee=Demo-Employee-2026
      MOCK_TOOLS_URL: http://mocktools:8081
    volumes:
      - appdata:/var/lib/accessflow
    depends_on:
      postgres:
        condition: service_healthy
      mocktools:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/accessflow", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Disposable test database: in-memory, test profile only (DECISIONS.md A2, 2026-10-28).
  postgres-test:
    <<: *postgres
    profiles: [test]
    # Parallel tests each hold a few pools, so allow more than the default 100 connections.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=400"]
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro

  tests:
    image: golang:1.27.3-bookworm # Debian-based: go test -race needs cgo
    profiles: [test]
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    environment:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres_local@postgres-test:5432/postgres
      TEST_OWNER_DATABASE_URL: postgres://accessflow_owner:accessflow_owner_local@postgres-test:5432/accessflow
      TEST_APP_DATABASE_URL: postgres://accessflow_app:accessflow_app_local@postgres-test:5432/accessflow
      TEST_MOCKTOOLS_DATABASE_URL: postgres://mocktools:mocktools_local@postgres-test:5432/mocktools
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -e
        # All Go code lives in cmd/ and internal/ (A8). No `go list` here: it needs git, which
        # refuses CI checkouts owned by another user, and its failure made this check pass silently.
        unformatted=$$(gofmt -l cmd internal)
        if [ -n "$$unformatted" ]; then echo "gofmt needed:"; echo "$$unformatted"; exit 1; fi
        go vet ./...
        # internal/requests is the longest package (its tests run in parallel, about 4 minutes
        # locally with -race); 20m leaves room on slow machines.
        go test -race -count=1 -timeout 20m ./...

  # Browser smoke test (e2e profile): run ./e2e.sh, which starts a separate, fresh Compose project
  # and removes it afterwards. Playwright's official image; its dependency lives in e2e/ only.
  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: [e2e]
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
      - /e2e/node_modules # installed in the container, never on the host
    # Shares the app's network namespace, so the browser opens http://localhost:8080 exactly as a
    # reviewer does (a secure context; Chromium also forces HTTPS on the bare host "app").
    network_mode: service:app
    environment:
      BASE_URL: http://localhost:8080
      DEMO_PASSWORDS: *demo-passwords
    depends_on:
      app:
        condition: service_healthy
    command: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && npx playwright test"]

volumes:
  pgdata:
  appdata:
  gomodcache:
  gobuildcache:
